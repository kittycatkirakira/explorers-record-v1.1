<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>探索者の記録 v1.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
#app{max-width:760px;margin:auto;min-height:100vh;background:#172033}.top{padding:16px;background:#0f172a;position:sticky;top:0;border-bottom:1px solid #334155;z-index:3}
.top h1{margin:0;font-size:22px}.sub,.small{font-size:12px;color:#94a3b8}.main{padding:14px 14px 90px}.card{background:#202c42;border:1px solid #334155;border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.stat{background:#0f172a;border-radius:8px;padding:7px;font-size:11px}.stat b{display:block;font-size:14px;margin-top:2px}
button,input,select{font:inherit}button{border:0;border-radius:10px;padding:11px 13px;color:#fff;background:#475569;font-weight:700}button.primary{background:#2563eb}button.warn{background:#92400e}button:disabled{opacity:.45}
input,select{width:100%;padding:10px;margin-top:5px;border:1px solid #475569;border-radius:9px;background:#0f172a;color:#fff}label{display:block;font-size:12px;color:#cbd5e1;margin:9px 0}
.badge{display:inline-block;background:#334155;border-radius:999px;padding:3px 7px;font-size:11px;margin:2px}.log{background:#0b1020;border-radius:10px;padding:10px;line-height:1.6;font-size:12px;max-height:360px;overflow:auto}.loot{color:#fde68a}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#0f172a;border-top:1px solid #334155;display:flex;z-index:4}.tabs button{flex:1;border-radius:0;background:transparent;padding:12px 3px;font-size:12px}.tabs button.active{background:#1d4ed8}
.bar{height:8px;background:#0f172a;border-radius:8px;overflow:hidden;margin:7px 0}.bar i{display:block;height:100%;background:#64748b}.timer{font-size:20px;font-weight:800}.event{padding:8px 10px;border-left:3px solid #64748b;background:#111827;margin-top:7px;border-radius:7px}.danger{border-left-color:#b91c1c}.good{border-left-color:#15803d}.rare{border-left-color:#b45309}
</style>
</head>
<body><div id="app">
<header class="top"><h1>探索者の記録</h1><div class="sub">実動プロトタイプ v1.1 — 探索・階層・敵パーティー・詳細戦闘</div></header>
<main id="main" class="main"></main>
<nav class="tabs">
<button id="t-home" onclick="view('home')">🏠 拠点</button>
<button id="t-char" onclick="view('char')">👤 仲間</button>
<button id="t-party" onclick="view('party')">👥 編成</button>
<button id="t-explore" onclick="view('explore')">🗺️ 探索</button>
</nav></div>
<script>
const R=["人間","フェルナ族","エルナ族","ザルガ族","ネアリス族"],J=["戦士","狩人","術士","祈祷師"];
const S=["HP","MP","攻撃","防御","魔力","精神","速度","命中","回避","運"];
const AREAS=[
{name:"始まりの地",rec:1,floors:5,sec:10,clear:50,repeat:30,m:["野犬","小鬼","草原兎"],attr:["地","無","風"],boss:["始原の獣","地",190],rates:[.15,.10,.02]},
{name:"森林",rec:4,floors:10,sec:30,clear:300,repeat:180,m:["森狼","毒蛇","人喰い草"],attr:["風","水","地"],boss:["森王","地",420],rates:[.20,.08,.02]},
{name:"山岳",rec:8,floors:12,sec:45,clear:540,repeat:360,m:["山犬","岩蟲","狂戦鬼"],attr:["地","地","火"],boss:["山岳王","地",720],rates:[.25,.07,.03]},
{name:"洞窟",rec:12,floors:15,sec:60,clear:900,repeat:600,m:["洞窟鼠","地底蛇","闇蝙蝠"],attr:["闇","地","闇"],boss:["深層魔獣","闇",1050],rates:[.30,.06,.03]},
{name:"水域",rec:18,floors:12,sec:90,clear:1080,repeat:720,m:["水棲獣","大蛙","水蛇"],attr:["水","水","水"],boss:["水域主","水",1500],rates:[.32,.055,.035]},
{name:"遺跡",rec:25,floors:20,sec:120,clear:2400,repeat:1500,m:["遺跡兵","呪像","古代獣"],attr:["無","闇","地"],boss:["遺跡守護者","闇",2600],rates:[.34,.05,.04]},
{name:"竜域",rec:35,floors:25,sec:180,clear:4500,repeat:2700,m:["竜鱗獣","飛竜","魔竜"],attr:["火","風","闇"],boss:["古竜","火",5200],rates:[.35,.05,.05]}
];
const base={HP:100,MP:30,攻撃:18,防御:12,魔力:12,精神:12,速度:10,命中:80,回避:10,運:10};
let state={gold:1000,chars:[],parties:[[],[],[],[]],expedition:null,cleared:{},log:[]};
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function save(){localStorage.er11=JSON.stringify(state)}
function load(){try{let x=JSON.parse(localStorage.er11);if(x)state=Object.assign(state,x)}catch(e){}}
function mods(r,j){
 const rm={人間:[5,2,2,2,2,2,2,0,0,2],フェルナ族:[0,0,2,0,1,1,6,8,8,3],エルナ族:[-5,5,-2,0,6,7,4,4,4,5],ザルガ族:[25,-2,7,7,-2,1,-2,0,-2,1],ネアリス族:[0,10,-2,1,4,6,2,2,3,3]}[r];
 const jm={戦士:[25,-5,7,6,-4,1,-2,0,-1,0],狩人:[5,0,4,0,0,0,7,8,6,2],術士:[-5,15,-3,-1,9,6,1,2,1,2],祈祷師:[0,20,-4,1,5,9,0,1,0,5]}[j];
 let s={...base};S.forEach((k,i)=>s[k]+=rm[i]+jm[i]);return s
}
function needXp(lv){return 100+25*(lv-1)*(lv-1)}
function grow(c){
 const r=c.race;
 const g={人間:[10,4,2,1,1,1,1,0,0,1],フェルナ族:[6,2,3,1,1,1,3,1,2,1],エルナ族:[4,5,1,0,3,3,2,1,1,1],ザルガ族:[18,1,4,3,0,1,0,0,0,0],ネアリス族:[5,7,0,1,3,4,1,1,1,2]}[r];
 const j={戦士:[8,-2,3,2,-1,0,0,0,0,0],狩人:[3,0,2,0,0,0,3,1,2,1],術士:[1,4,-1,0,3,2,0,0,0,0],祈祷師:[2,5,-1,0,1,3,0,0,0,2]}[c.job];
 S.forEach((k,i)=>c.stats[k]+=g[i]+j[i])
}
function addXp(c,x,L){
 c.xp+=x;
 while(c.xp>=needXp(c.level)){c.xp-=needXp(c.level);c.level++;grow(c);L.push(`${c.name}はLv.${c.level}になった！`)}
}
function register(){
 if(state.chars.length>=40)return alert("登録できる仲間は最大40人です。");
 let n=document.getElementById("nm").value.trim()||"名無し",r=document.getElementById("rc").value,j=document.getElementById("jb").value;
 let c={id:Date.now()+Math.random(),name:n,race:r,job:j,level:1,xp:0,tactic:"標準",stats:mods(r,j),weapon:{name:"初期武器",rarity:1,atk:0,enhance:0}};
 state.chars.push(c);state.log.unshift(`「${n}」を登録しました。`);save();chars()
}
function tactic(id,v){let c=state.chars.find(x=>x.id==id);if(c)c.tactic=v;save()}
function chars(){
 let x=`<h2>仲間</h2><div class=card><b>新規登録</b><label>名前<input id=nm maxlength=12 placeholder="例：カイル"></label><label>種族<select id=rc>${R.map(x=>`<option>${x}</option>`).join("")}</select></label><label>職業<select id=jb>${J.map(x=>`<option>${x}</option>`).join("")}</select></label><button class=primary onclick=register()>仲間を登録</button><div class=small style="margin-top:8px">登録 ${state.chars.length}/40人</div></div>`;
 state.chars.forEach(c=>x+=`<div class=card><div class=row><b>${esc(c.name)}</b><span><span class=badge>${c.race}</span><span class=badge>${c.job}</span></span></div><div class=small>Lv.${c.level}　経験値 ${c.xp}/${needXp(c.level)}　作戦：${c.tactic}</div><div class=stats>${S.map(k=>`<div class=stat>${k}<b>${c.stats[k]}</b></div>`).join("")}</div><label>個人作戦<select onchange="tactic(${c.id},this.value)">${["標準","攻撃重視","防御重視","安全重視","弱点重視"].map(y=>`<option ${c.tactic==y?"selected":""}>${y}</option>`).join("")}</select></label></div>`);
 main.innerHTML=x
}
function party(){
 let x=`<h2>パーティー編成</h2><div class=card><div class=small">最大4パーティー / 1パーティー最大5人</div>`;
 for(let p=0;p<4;p++){x+=`<div class=event"><b>第${p+1}パーティー</b><div class=small">現在 ${state.parties[p].length}/5人</div>`;
 state.chars.forEach(c=>{let inOther=state.parties.some((q,qi)=>qi!==p&&q.includes(c.id));x+=`<label><input type=checkbox style="width:auto" ${state.parties[p].includes(c.id)?"checked":""} ${inOther?"disabled":""} onchange="toggle(${p},${c.id})"> ${esc(c.name)}（${c.race} / ${c.job} / Lv.${c.level}）</label>`});
 x+=`</div>`}
 x+=`</div>`;main.innerHTML=x
}
function toggle(p,id){let q=state.parties[p];if(q.includes(id))state.parties[p]=q.filter(x=>x!=id);else if(q.length<5)q.push(id);save();party()}
function eff(a,d){let p={"火":"氷","氷":"風","風":"水","水":"火","光":"闇","闇":"光"};if(p[a]===d)return 1.5;if(p[d]===a)return .75;return 1}
function rarity(){let r=Math.random();return r<.0005?5:r<.005?4:r<.015?3:r<.055?2:1}
function enemyParty(a,floor,boss=false){
 if(boss)return [{name:a.boss[0],attr:a.boss[1],hp:Math.floor(a.boss[2]*(1+floor*.08)),maxHp:Math.floor(a.boss[2]*(1+floor*.08)),lv:a.rec+floor}];
 let n=1+Math.floor(Math.random()*Math.min(5,2+Math.floor(floor/3))),arr=[];
 for(let i=0;i<n;i++){let k=Math.floor(Math.random()*a.m.length),lv=Math.max(1,a.rec+floor+Math.floor(Math.random()*3)-2),baseHp=30+a.rec*5+floor*9;let hp=Math.floor(baseHp*(.85+Math.random()*.4));arr.push({name:a.m[k],attr:a.attr[k],hp,maxHp:hp,lv})}
 return arr
}
function chooseTarget(arr){return arr.filter(e=>e.hp>0)[Math.floor(Math.random()*arr.filter(e=>e.hp>0).length)]}
function battle(team,enemies,a,floor){
 let L=[`⚔️ 第${floor}階層：敵パーティーと遭遇！`,`敵：${enemies.map(e=>`${e.name} Lv.${e.lv}`).join(" / ")}`],turn=0;
 let live=team.map(c=>({c,hp:c.stats.HP}));
 while(turn<20&&enemies.some(e=>e.hp>0)&&live.some(x=>x.hp>0)){
  turn++; L.push(`―― 第${turn}ターン ――`);
  let order=live.filter(x=>x.hp>0).map(x=>x.c).sort((u,v)=>v.stats.速度-u.stats.速度);
  for(let c of order){
   if(!enemies.some(e=>e.hp>0))break;
   let e=chooseTarget(enemies),at=c.job==="術士"?"火":c.job==="祈祷師"?"光":"無";
   let hit=Math.random()<=Math.min(.98,c.stats.命中/100),evade=Math.random()<evasion(e);
   if(!hit){L.push(`${c.name}の攻撃！ → ${e.name}に当たらなかった。`);continue}
   if(evade){L.push(`${c.name}の攻撃！ → ${e.name}は回避した！`);continue}
   let d=Math.max(1,Math.floor((c.stats.攻撃+c.weapon.atk+c.weapon.enhance*2)*(c.job==="術士"?1.25:1)*eff(at,e.attr)*(0.8+Math.random()*.4)-e.lv*1.5));
   let crit=Math.random()<Math.min(.25,c.stats.運/500);if(crit){d=Math.floor(d*1.5);L.push(`${c.name}の攻撃！ 会心の一撃！ → ${e.name}に${d}ダメージ！`)}else L.push(`${c.name}の攻撃！ → ${e.name}に${d}ダメージ！`);
   e.hp-=d;if(e.hp<=0)L.push(`${e.name}を撃破！`)
  }
  for(let e of enemies.filter(e=>e.hp>0)){
   let t=live.filter(x=>x.hp>0)[Math.floor(Math.random()*live.filter(x=>x.hp>0).length)];if(!t)break;
   let hit=Math.random()<.84,ev=Math.random()<t.c.stats.回避/200;
   if(!hit){L.push(`${e.name}の攻撃！ → ${t.c.name}は攻撃をかわした。`);continue}
   if(ev){L.push(`${e.name}の攻撃！ → ${t.c.name}は回避した！`);continue}
   let d=Math.max(1,Math.floor((10+e.lv*3)*(0.8+Math.random()*.4)-t.c.stats.防御*.35));
   t.hp-=d;L.push(`${e.name}の攻撃！ → ${t.c.name}に${d}ダメージ！`);
   if(t.hp<=0)L.push(`${t.c.name}は戦闘不能！`)
  }
 }
 let win=!enemies.some(e=>e.hp>0),xp=0,g=0;
 if(win){enemies.forEach(e=>xp+=Math.floor(18+e.lv*7));g=Math.floor(10+xp*.7);L.push(`敵パーティーを撃破！（${turn}ターン）`)}
 else {xp=Math.floor(8+floor*2);g=Math.floor(5+floor*2);L.push(`20ターン経過。決着せず、逃走帰還。`)}
 team.forEach(c=>addXp(c,xp,L));state.gold+=g;
 if(win&&Math.random()<.25){let r=rarity(),owner=team[Math.floor(Math.random()*team.length)],item={name:["","鉄","鋼","魔導","精霊","神秘"][r]+"の装備",rarity:r,atk:3*r+Math.floor(Math.random()*7),enhance:0};L.push(`🎁 装備獲得：${item.name} ★${r}（攻撃+${item.atk}）`);if(item.atk>owner.weapon.atk){owner.weapon=item;L.push(`${owner.name}が装備しました。`)}}
 L.push(`獲得経験値：${xp} / ゴールド：${g} G`);
 return {L,win}
}
function evasion(e){return .05}
function eventAt(exp){
 let a=AREAS[exp.area],r=Math.random(),[enemyR,chestR,specialR]=a.rates;
 if(exp.floor===a.floors&&exp.segment===5)return "boss";
 if(r<enemyR)return "enemy";if(r<enemyR+chestR)return "chest";if(r<enemyR+chestR+specialR)return "special";return "none"
}
function runEvent(p){
 let exp=state.expedition;if(!exp||exp.partyIndex!==p)return;
 let a=AREAS[exp.area],team=state.chars.filter(c=>state.parties[p].includes(c.id));
 let ev=eventAt(exp),L=exp.log||[];
 if(ev==="enemy"){let enemies=enemyParty(a,exp.floor,false),res=battle(team,enemies,a,exp.floor);L.push(...res.L)}
 else if(ev==="boss"){let enemies=enemyParty(a,exp.floor,true),res=battle(team,enemies,a,exp.floor);L.push(...res.L);if(res.win){state.cleared[a.name]=true;L.push(`🏆 ${a.name}を踏破！`)}}
 else if(ev==="chest"){let r=rarity(),g=20+Math.floor(Math.random()*30)*(exp.floor+1);state.gold+=g;L.push(`🎁 宝箱を発見！ ${g} Gを獲得。${r>=3?` ★${r}装備の気配がある……`:""}`)}
 else if(ev==="special"){L.push(`✨ 特殊イベント：古い石碑を発見した。意味は分からないが、記録に残した。`)}
 else L.push(`第${exp.floor}階層・第${exp.segment}区間を探索した。周囲に異常はない。`);
 exp.log=L;save()
}
function startExp(p,area){
 if(state.expedition)return alert("現在探索中のパーティーがあります。");
 if(!state.parties[p].length)return alert("パーティーを編成してください。");
 let a=AREAS[area],first=!state.cleared[a.name],total=first?a.clear:a.repeat;
 state.expedition={partyIndex:p,area,floor:1,segment:0,started:Date.now(),endAt:Date.now()+total*1000,total,log:[`【第${p+1}パーティー】${a.name}の探索を開始。`,`クリア予定時間：${fmt(total)}`]};
 save();tick()
}
function tick(){
 let e=state.expedition;if(!e)return;
 let a=AREAS[e.area],elapsed=Math.floor((Date.now()-e.started)/1000),unit=a.sec/5,seg=Math.min(5,Math.floor(elapsed/unit)+1),floor=Math.min(a.floors,Math.floor(elapsed/a.sec)+1);
 while(e.floor<floor || (e.floor===floor&&e.segment<seg)){
   e.floor=e.floor===floor?e.floor:e.floor+1;e.segment=e.segment+1;if(e.segment>5){e.segment=1;e.floor++}
   if(e.floor<=a.floors)runEvent(e.partyIndex)
 }
 if(Date.now()>=e.endAt){let p=e.partyIndex;e.log.push(`🏠 第${p+1}パーティーが帰還しました！`);state.log=e.log.slice(-40);state.expedition=null;save();result(e.log);return}
 save();if(document.getElementById("t-explore")?.classList.contains("active"))explore();
 setTimeout(tick,1000)
}
function fmt(sec){let s=Math.max(0,Math.floor(sec)),m=Math.floor(s/60);return m?`${m}分${String(s%60).padStart(2,"0")}秒`:`${s}秒`}
function explore(){
 if(state.expedition){
  let e=state.expedition,a=AREAS[e.area],remain=Math.max(0,Math.ceil((e.endAt-Date.now())/1000)),elapsed=Math.max(0,Math.floor((Date.now()-e.started)/1000)),unit=a.sec/5;
  let x=`<h2>探索中</h2><div class=card><div class=row><b>第${e.partyIndex+1}パーティー</b><span class=badge>${a.name}</span></div><div>第${e.floor}階層　区間 ${Math.min(5,e.segment)}/5</div><div class=bar><i style="width:${Math.min(100,elapsed/e.total*100)}%"></i></div><div class=small>次のイベント判定まで：約 ${Math.max(0,Math.ceil(unit-(elapsed%a.sec)%unit))}秒</div><p>帰還まで</p><div class=timer>${fmt(remain)}</div><p class=small>クリア予定：${fmt(e.total)}</p></div><div class=card><b>探索ログ</b><div class=log>${e.log.slice(-30).map(esc).join("<br>")}</div></div>`;
  main.innerHTML=x;return
 }
 let x=`<h2>探索</h2><div class=card><b>探索システム</b><p class=small">1階層を5区間に分割し、各区間でイベント抽選。何も起きなくても探索ログに記録します。探索中は画面を閉じても時間が進みます。</p></div>`;
 AREAS.forEach((a,i)=>{let clear=!!state.cleared[a.name],t=clear?a.repeat:a.clear;x+=`<div class=card><div class=row><b>${a.name}</b><span class=badge>推奨Lv.${a.rec}</span></div><div class=small>${a.floors}階層 / 1階層 ${a.sec}秒 / ${clear?"周回":"初回"}クリア ${fmt(t)}</div><div class=small>敵：${a.m.join("・")} / 最終階層：${a.boss[0]}</div><div class=grid style="margin-top:9px">${[0,1,2,3].map(p=>`<button class=primary onclick="startExp(${p},${i})">第${p+1}PTで出発</button>`).join("")}</div></div>`});
 x+=`<div class=card><b>現在の確率（基準）</b><p class=small>敵遭遇：探索地ごと15～35% / 宝箱：約5～10% / 特殊：約2～5% / 残りは「何もなし」。<br>装備：★3 1.0% / ★4 0.45% / ★5 0.05%。</p></div>`;
 main.innerHTML=x
}
function result(L){main.innerHTML=`<h2>探索結果</h2><div class=card><div class=log>${L.map(esc).join("<br>")}</div><button class=primary style="margin-top:10px" onclick="view('explore')">探索へ戻る</button></div>`}
function home(){main.innerHTML=`<h2>拠点</h2><div class=card><div class=row><b>所持ゴールド</b><b>${state.gold.toLocaleString()} G</b></div></div><div class=card><b>進行</b><p class=small>仲間 ${state.chars.length}/40人 / パーティー 4枠</p><p class=small>登録 → 編成 → 探索 → 階層・区間イベント → 敵パーティー戦闘 → 報酬</p></div><div class=card><b>最近の記録</b><div class=log>${(state.log.length?state.log:["まだ記録はありません"]).map(esc).join("<br>")}</div></div>`}
function nav(v){document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));document.getElementById("t-"+v)?.classList.add("active")}
function view(v){nav(v);({home, char:chars, party, explore}[v]||home)()}
load();view("home");
if(state.expedition)setTimeout(tick,300);
</script></body></html>
